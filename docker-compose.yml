services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskqourai
      POSTGRES_USER: taskqourai
      POSTGRES_PASSWORD: taskqourai
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis